version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vanna_postgres
    environment:
      POSTGRES_DB: vanna_farsi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vanna_network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vanna_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vanna.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - vanna_network

volumes:
  postgres_data:

networks:
  vanna_network:
    driver: bridge